server {
    listen 80;
    server_name 161-118-174-116.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name pb.161-118-174-116.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pb.161-118-174-116.sslip.io;

    ssl_certificate /etc/letsencrypt/live/pb.161-118-174-116.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pb.161-118-174-116.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    server_name 161-118-174-116.sslip.io;

    ssl_certificate /etc/letsencrypt/live/161-118-174-116.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/161-118-174-116.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location = /pocketbase-admin {
        return 302 https://pb.161-118-174-116.sslip.io/_/;
    }

    location ^~ /_/ {
        return 302 https://pb.161-118-174-116.sslip.io$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}